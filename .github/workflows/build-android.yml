name: Build Click Before Frames (Android64)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: prevter/geode-sdk:android-5.9.0

    steps:
      - uses: actions/checkout@v4

      - name: Setup Geode CLI profile
        shell: bash
        run: |
          export CLI_PROFILE="$GITHUB_WORKSPACE/cli-profile"
          mkdir -p "$CLI_PROFILE/geode/mods"
          geode profile add --name GithubActions "$CLI_PROFILE/GeometryDash.exe" win

      - name: Build Android64
        run: geode build -p android64 --config Release -- -G Ninja -DGEODE_DONT_INSTALL_MODS=ON

      - name: Upload .geode package
        uses: actions/upload-artifact@v4
        with:
          name: ClickBeforeFrames-android64
          path: build-android64/*.geode
          if-no-files-found: error
